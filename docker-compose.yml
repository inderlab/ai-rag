services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      PUBLIC_APP_URL: http://localhost:8080
    volumes:
      - vidmind_data:/data
      - hf_models:/models
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["automation"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  vidmind_data:
  hf_models:
  n8n_data:
